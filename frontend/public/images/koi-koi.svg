<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="koi-title koi-desc">
  <title id="koi-title">KOI KOI oyun kartı</title>
  <desc id="koi-desc">KOI KOI için ortak temada oyun kartı görseli.</desc>
  <defs>
    <linearGradient id="koi-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#be3a2f"/>
    </linearGradient>
    <linearGradient id="koi-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7e7"/>
      <stop offset="1" stop-color="#ead7b8"/>
    </linearGradient>
    <linearGradient id="koi-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d62828"/>
      <stop offset="1" stop-color="#8f1d1d"/>
    </linearGradient>
    <filter id="koi-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#081018" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#koi-bg)"/>
  <circle cx="132" cy="92" r="118" fill="#fde68a" opacity=".22"/>
  <circle cx="830" cy="434" r="154" fill="#ffffff" opacity=".08"/>
  <g filter="url(#koi-shadow)">
    <rect x="56" y="42" width="848" height="456" rx="34" fill="rgba(14,20,26,.18)"/>
    <rect x="74" y="60" width="812" height="420" rx="28" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.16)"/>
    <rect x="104" y="100" width="752" height="254" rx="26" fill="rgba(7,10,14,.18)" stroke="rgba(255,255,255,.12)"/>

    <rect x="244" y="122" width="472" height="212" rx="26" fill="rgba(20,26,34,.22)"/>
    <rect x="264" y="142" width="432" height="172" rx="18" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.16)"/>

    <g transform="translate(334 122)">
      <rect x="0" y="0" width="122" height="174" rx="16" fill="url(#koi-card)" stroke="#d5c2a3" stroke-width="6" transform="rotate(-9 61 87)"/>
      <rect x="168" y="0" width="122" height="174" rx="16" fill="url(#koi-card)" stroke="#d5c2a3" stroke-width="6" transform="rotate(9 229 87)"/>
      <rect x="84" y="-12" width="132" height="194" rx="18" fill="url(#koi-card)" stroke="#d5c2a3" stroke-width="7"/>
      <rect x="102" y="8" width="96" height="154" rx="12" fill="url(#koi-red)"/>
      <path d="M116 124 C138 108, 162 108, 184 124" fill="none" stroke="#fff4d6" stroke-width="7" stroke-linecap="round"/>
      <path d="M118 106 C136 88, 162 84, 184 100" fill="none" stroke="#fff4d6" stroke-width="6" stroke-linecap="round"/>
      <circle cx="168" cy="54" r="28" fill="#fff7ea" opacity=".92"/>
    </g>

    <text x="118" y="405" fill="rgba(255,255,255,.72)" font-family="Verdana, sans-serif" font-size="16" font-weight="700" letter-spacing="3">ONLINE MASA OYUNU</text>
    <text x="118" y="448" fill="#fff7ea" font-family="Georgia, serif" font-size="48" font-weight="700">KOI KOI</text>
  </g>
</svg>
