<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="batak-title batak-desc">
  <title id="batak-title">BATAK oyun kartı</title>
  <desc id="batak-desc">İhaleli Batak için ortak temada oyun kartı görseli.</desc>
  <defs>
    <linearGradient id="batak-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15324f"/>
      <stop offset="1" stop-color="#1a6b5d"/>
    </linearGradient>
    <filter id="batak-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#081018" flood-opacity=".28"/>
    </filter>
    <linearGradient id="batak-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#f0e4d2"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#batak-bg)"/>
  <circle cx="144" cy="92" r="124" fill="#f0d89e" opacity=".18"/>
  <circle cx="814" cy="420" r="160" fill="#ffffff" opacity=".08"/>
  <g filter="url(#batak-shadow)">
    <rect x="56" y="42" width="848" height="456" rx="34" fill="rgba(14,20,26,.18)"/>
    <rect x="74" y="60" width="812" height="420" rx="28" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.16)"/>
    <rect x="106" y="102" width="748" height="252" rx="26" fill="rgba(7,10,14,.2)" stroke="rgba(255,255,255,.12)"/>

    <g transform="translate(226 128) rotate(-10 90 118)">
      <rect x="0" y="0" width="180" height="236" rx="22" fill="url(#batak-card)" />
      <text x="28" y="52" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#12263b">A</text>
      <text x="28" y="94" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#12263b">♠</text>
    </g>
    <g transform="translate(390 112)">
      <rect x="0" y="0" width="180" height="236" rx="22" fill="url(#batak-card)" />
      <text x="28" y="52" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#b44640">K</text>
      <text x="28" y="94" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#b44640">♥</text>
      <circle cx="132" cy="170" r="30" fill="rgba(21,50,79,.1)"/>
      <text x="132" y="182" text-anchor="middle" font-family="Verdana, sans-serif" font-size="28" font-weight="700" fill="#17314c">10</text>
    </g>
    <g transform="translate(554 128) rotate(10 90 118)">
      <rect x="0" y="0" width="180" height="236" rx="22" fill="url(#batak-card)" />
      <text x="28" y="52" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#d77b2d">Q</text>
      <text x="28" y="94" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#d77b2d">♦</text>
    </g>

    <rect x="385" y="218" width="190" height="54" rx="18" fill="rgba(15, 26, 36, .3)" stroke="rgba(255,255,255,.16)"/>
    <text x="480" y="253" text-anchor="middle" fill="#f4d598" font-family="Verdana, sans-serif" font-size="26" font-weight="700">İHALELİ</text>

    <text x="118" y="405" fill="rgba(255,255,255,.72)" font-family="Verdana, sans-serif" font-size="16" font-weight="700" letter-spacing="3">ONLINE MASA OYUNU</text>
    <text x="118" y="448" fill="#fff7ea" font-family="Georgia, serif" font-size="48" font-weight="700">BATAK</text>
  </g>
</svg>
