      <stop offset="1" stop-color="#2d6f7d"/>
    </linearGradient>
    <filter id="sudoku-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#081018" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#sudoku-bg)"/>
  <circle cx="138" cy="96" r="126" fill="#f0d797" opacity=".18"/>
  <circle cx="820" cy="424" r="164" fill="#ffffff" opacity=".08"/>
