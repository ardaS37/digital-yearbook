  </defs>
  <rect width="960" height="540" fill="url(#lingo-bg)"/>
  <circle cx="132" cy="92" r="118" fill="#efd39a" opacity=".18"/>
  <circle cx="830" cy="434" r="154" fill="#ffffff" opacity=".08"/>
