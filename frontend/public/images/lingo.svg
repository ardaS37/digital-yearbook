      <rect x="88" width="72" height="72" rx="14" fill="#f4c35f"/><text x="124" y="48" text-anchor="middle" fill="#4f2b00" font-family="Verdana" font-size="34" font-weight="700">İ</text>
      <rect x="176" width="72" height="72" rx="14" fill="#2f8f5b"/><text x="212" y="48" text-anchor="middle" fill="#fff8ee" font-family="Verdana" font-size="34" font-weight="700">N</text>
      <rect x="264" width="72" height="72" rx="14" fill="#b94b44"/><text x="300" y="48" text-anchor="middle" fill="#fff8ee" font-family="Verdana" font-size="34" font-weight="700">G</text>
