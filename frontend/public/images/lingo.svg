      <stop offset="0" stop-color="#163d5c"/>
      <stop offset="1" stop-color="#b56a38"/>
    </linearGradient>
    <filter id="lingo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#081018" flood-opacity=".28"/>
