<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klasik Oyunlar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Yıllık Oyunları</p>
        <h1 id="game-title">Klasik Oyun</h1>
        <p>Yıllık hesabınla online oda kur, açık odalara katıl ve arkadaşlarınla klasik oyunlar oyna.</p>
      </div>
      <a href="/games">Oyunlara dön</a>
    </header>

    <section class="panel controls">
      <select id="game-select"></select>
      <button id="pc-room" type="button">PC’ye Karşı</button>
      <button id="create-room">Online Oda Kur</button>
      <form id="join-form">
        <input id="room-code" maxlength="6" placeholder="Oda kodu">
        <button>Katıl</button>
      </form>
      <div class="open">
        <div class="open-head">
          <strong>Açık Odalar</strong>
          <button id="refresh" class="small" type="button">Yenile</button>
        </div>
        <div id="open-list">Yükleniyor...</div>
      </div>
    </section>

    <section class="layout">
      <aside class="panel status">
        <p class="eyebrow">Oda</p>
        <h2 id="room-title">Henüz oda yok</h2>
        <p id="players"></p>
        <p id="turn"></p>
        <p id="message"></p>
      </aside>
      <section class="panel board-panel">
        <div id="board"></div>
      </section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
